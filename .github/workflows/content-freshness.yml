name: District content freshness

# The content gate in `npm test` and the pull request CI is evaluated at the
# latest recorded review, so it never turns red only because a date passed
# (TESTS-INFRA-1). Whether reviewed district content is still public today is
# checked here instead, on a schedule and never on a pull request: a failed
# run notifies the owner that a dated review (planning rows, transport checks,
# market data) has run out, without blocking any merge. Content that expires
# within 30 days is reported as a warning.

on:
  schedule:
    # Mondays 06:00 UTC (09:00 Europe/Istanbul).
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Report district content freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Reads only data/districts/*.json in the checkout: no database, no
      # secret and no network. Writes the result to the job summary.
      - name: District content freshness
        run: npm run report:districts:freshness
